# T3 localization — nav2 AMCL + map_server 파라미터 (humble)
# map.yaml origin [0,0,0]·해상도 0.1 = 씬 월드 좌표와 동일 프레임.
# odom은 시뮬 정답 포즈(무노이즈)라 alpha를 작게 — 이후 노이즈 주입 시 상향.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.4
    laser_max_range: 20.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    transform_tolerance: 0.5
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    z_hit: 0.7
    z_rand: 0.3
    sigma_hit: 0.15
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 34.0
      y: 40.8
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    # yaml_filename은 loc.launch.py가 절대경로로 주입

foxglove_bridge:
  ros__parameters:
    use_sim_time: true
    port: 8765
    address: 0.0.0.0
