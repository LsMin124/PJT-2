# deep 실행 전용. cwd = worktree 루트에서 실행.
[mypy]
python_version = 3.11
namespace_packages = True
explicit_package_bases = True
mypy_path = 3_FMS:3_FMS/sim_engine:3_FMS/infra/worker:2_Simulation/t4_agent/src/amr_agent
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
warn_unused_ignores = False
exclude = (?x)(results/|isaac_export_|\.pytest_cache/|5_Docs/|node_modules/|build/)

# 핵심 모듈만 조금 더 엄격
[mypy-contracts.*,fms_kernel,pibt_core,map_loader,order_stream,from_theta,objective,amr_agent.*]
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True

[mypy-isaacsim.*,omni.*,pxr.*,usdrt.*,carb.*,rclpy.*,nav_msgs.*,geometry_msgs.*,std_msgs.*,sensor_msgs.*,tf2_ros.*,launch.*,launch_ros.*,amr_agent_msgs.*,paho.*,ezdxf.*,scipy.*,optuna.*,psycopg2.*,simpy.*,matplotlib.*,numpy.*]
ignore_missing_imports = True
