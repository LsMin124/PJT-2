<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR 도입 견적 — 워크플로우 아키텍처</title>
<style>
  :root{
    --bg:#faf9f5; --card:#ffffff; --border:#e8e6dc; --text:#1a1a17; --text2:#5f5e5a; --muted:#888780;
    --purple-50:#EEEDFE; --purple-600:#534AB7; --purple-800:#3C3489;
    --teal-50:#E1F5EE; --teal-600:#0F6E56; --teal-800:#085041;
    --coral-50:#FAECE7; --coral-600:#993C1D; --coral-800:#712B13;
    --gray-50:#F1EFE8; --gray-600:#5F5E5A; --gray-800:#444441;
    --blue-50:#E6F1FB; --blue-600:#185FA5; --blue-800:#0C447C;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:32px 16px;}
  .wrap{width:100%;max-width:780px;}
  h1{font-size:20px;font-weight:600;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tabs button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;}
  .tabs button.active{background:var(--card);border-color:#c9c6b8;color:var(--text);font-weight:600;}
  svg{width:100%;height:auto;display:block;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin:14px 0;}
  .panel .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .panel .title{font-size:15px;font-weight:600;margin-bottom:6px;}
  .panel .desc{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:10px;}
  .flows{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:6px;}
  .flow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:13px;}
  .fd{font-weight:600;color:var(--text);}
  .fp{font-family:"SF Mono",Consolas,monospace;font-size:12px;background:var(--gray-50);border:1px solid var(--border);border-radius:5px;padding:1px 7px;color:var(--gray-800);}
  .fr{color:var(--muted);font-size:12.5px;}
  .ctrl{display:flex;gap:8px;align-items:center;}
  .ctrl button{font:inherit;font-size:13px;padding:8px 16px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;}
  .ctrl button:hover{background:var(--gray-50);}
  .ctrl .hint{font-size:12px;color:var(--muted);margin-left:auto;}
  .node rect,.node text{transition:opacity .25s;}
  .node text{font-weight:600;}
  path.edge{stroke:#8a8878;fill:none;transition:opacity .25s,stroke-width .25s;}
  text.nl{font-size:13px;}
  text.pl{font-size:10.5px;fill:#9a978a;font-family:"SF Mono",Consolas,monospace;transition:opacity .25s;}
</style>
</head>
<body>
<div class="wrap">
  <h1>AMR 도입 견적 서비스 — 작업 흐름</h1>
  <p class="sub">방향키 ←/→ 단계 이동 · 숫자 1/2 탭 전환 — 각 단계의 데이터·프로토콜·경로가 아래 패널에 표시됩니다</p>
  <div class="tabs">
    <button id="tab-quote" class="active">본편 — 견적 파이프라인</button>
    <button id="tab-inner">근거 — 시뮬레이션 내부</button>
  </div>
  <svg viewBox="0 0 640 470" role="img" aria-label="견적 중심 시스템 아키텍처와 프로토콜">
    <defs><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8878" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
    <path id="e-fe-be" class="edge" d="M320 60 L320 88" marker-end="url(#aw)"/><text id="l-fe-be" class="pl" x="330" y="78">REST · WS</text>
    <path id="e-be-pg" class="edge" d="M230 136 L230 166" marker-end="url(#aw)"/><text id="l-be-pg" class="pl" x="160" y="156">JDBC</text>
    <path id="e-be-emqx" class="edge" d="M410 136 L410 166" marker-end="url(#aw)"/><text id="l-be-emqx" class="pl" x="420" y="156">MQTT</text>
    <path id="e-emqx-fms" class="edge" d="M410 214 L410 244" marker-end="url(#aw)"/><text id="l-emqx-fms" class="pl" x="420" y="234">MQTT</text>
    <path id="e-pg-worker" class="edge" d="M165 214 L165 326" marker-end="url(#aw)"/><text id="l-pg-worker" class="pl" x="94" y="274">SQL</text>
    <path id="e-fms-worker" class="edge" d="M230 292 L230 326" marker-end="url(#aw)"/><text id="l-fms-worker" class="pl" x="240" y="314">import</text>
    <path id="e-emqx-agent" class="edge" d="M520 214 L520 326" marker-end="url(#aw)"/><text id="l-emqx-agent" class="pl" x="530" y="274">MQTT · VDA 5050</text>
    <path id="e-agent-isaac" class="edge" d="M475 374 L475 396" marker-end="url(#aw)"/><text id="l-agent-isaac" class="pl" x="485" y="390">DDS</text>
    <g id="n-fe" class="node"><rect x="170" y="16" width="300" height="44" rx="6" fill="var(--purple-50)" stroke="var(--purple-600)" stroke-width="1"/><text class="nl" x="320" y="38" text-anchor="middle" dominant-baseline="central" fill="var(--purple-800)">React FE — 스튜디오 · 리포트 · 관제</text></g>
    <g id="n-be" class="node"><rect x="170" y="92" width="300" height="44" rx="6" fill="var(--purple-50)" stroke="var(--purple-600)" stroke-width="1"/><text class="nl" x="320" y="114" text-anchor="middle" dominant-baseline="central" fill="var(--purple-800)">Spring BE — WMS · 큐 · LLM 리포트</text></g>
    <g id="n-pg" class="node"><rect x="40" y="170" width="250" height="44" rx="6" fill="var(--gray-50)" stroke="var(--gray-600)" stroke-width="1"/><text class="nl" x="165" y="192" text-anchor="middle" dominant-baseline="central" fill="var(--gray-800)">PostgreSQL — 시나리오 · KPI</text></g>
    <g id="n-emqx" class="node"><rect x="350" y="170" width="250" height="44" rx="6" fill="var(--gray-50)" stroke="var(--gray-600)" stroke-width="1"/><text class="nl" x="475" y="192" text-anchor="middle" dominant-baseline="central" fill="var(--gray-800)">EMQX — biz · fms · uagv 토픽</text></g>
    <g id="n-fms" class="node"><rect x="170" y="248" width="300" height="44" rx="6" fill="var(--teal-50)" stroke="var(--teal-600)" stroke-width="1"/><text class="nl" x="320" y="270" text-anchor="middle" dominant-baseline="central" fill="var(--teal-800)">FMS 코어 — 할당 · 플래너 · 예약</text></g>
    <g id="n-worker" class="node"><rect x="40" y="330" width="250" height="44" rx="6" fill="var(--coral-50)" stroke="var(--coral-600)" stroke-width="1"/><text class="nl" x="165" y="352" text-anchor="middle" dominant-baseline="central" fill="var(--coral-800)">sim-worker — SimPy DES 스윕</text></g>
    <g id="n-agent" class="node"><rect x="350" y="330" width="250" height="44" rx="6" fill="var(--blue-50)" stroke="var(--blue-600)" stroke-width="1"/><text class="nl" x="475" y="352" text-anchor="middle" dominant-baseline="central" fill="var(--blue-800)">amr-agent × N — ROS 2</text></g>
    <g id="n-isaac" class="node"><rect x="350" y="400" width="250" height="44" rx="6" fill="var(--blue-50)" stroke="var(--blue-600)" stroke-width="1"/><text class="nl" x="475" y="422" text-anchor="middle" dominant-baseline="central" fill="var(--blue-800)">Isaac Sim — 물리 검증(SIL)</text></g>
  </svg>
  <div class="panel">
    <p class="label" id="step-label"></p>
    <p class="title" id="step-title"></p>
    <p class="desc" id="step-desc"></p>
    <div class="flows" id="step-flows"></div>
  </div>
  <div class="ctrl">
    <button id="btn-prev">← 이전</button>
    <button id="btn-next">다음 →</button>
    <span class="hint" id="flow-hint"></span>
  </div>
</div>
<script>
var flows={quote:[
{t:"고객 창고 시나리오 입력",d:"레이아웃, 경로망 그래프, 주문 프로파일, 화주 구성을 스튜디오에서 정의합니다. 이것이 견적의 입력 전부입니다.",n:["n-fe","n-be"],e:["e-fe-be"],f:[
 {fd:"시나리오 JSON (레이아웃·그래프·수요·화주)",fp:"REST POST /api/scenarios",fr:"frontend → backend"}]},
{t:"견적 잡 적재",d:"BE가 견적 요청을 작업 큐 테이블에 기록합니다. 웹 요청과 시뮬레이션 실행이 분리되어, 무거운 계산이 서비스 응답을 막지 않습니다.",n:["n-be","n-pg"],e:["e-be-pg"],f:[
 {fd:"견적 잡 레코드 (scenario_id·스윕 범위·시드 수)",fp:"JDBC INSERT quote_jobs",fr:"backend → postgres"}]},
{t:"구성 스윕 병렬 실행",d:"k3s Job들이 큐를 폴링해 로봇 대수 구성별 × 시드 반복을 병렬 실행합니다. 각 런 내부에서는 주문→출고 전 체인이 가상 시간으로 돌아갑니다(근거 탭).",n:["n-pg","n-worker","n-fms"],e:["e-pg-worker","e-fms-worker"],f:[
 {fd:"잡 클레임 + 시나리오·보정분포 로드",fp:"SQL SELECT … FOR UPDATE SKIP LOCKED",fr:"sim-worker ← postgres"},
 {fd:"FMS 사이클 호출 (할당·계획·release)",fp:"in-process (동일 코드베이스 import)",fr:"sim-worker ⊃ fms-core"}]},
{t:"분포 집계 — 점추정이 아닌 분포",d:"반복 실행에서 구성별 처리량 P50/P10, 리드타임, 병목이 집계됩니다. '최악의 달에도 보장되는 숫자'가 여기서 나옵니다.",n:["n-worker","n-pg"],e:["e-pg-worker"],f:[
 {fd:"런별 KPI (처리량·리드타임·대기·병목)",fp:"SQL INSERT run_kpi + parquet 덤프",fr:"sim-worker → postgres/스토리지"}]},
{t:"신뢰성 — 물리 캘리브레이션",d:"DES가 쓰는 엣지 통과·도킹 시간 분포는 같은 FMS 코드를 Isaac Sim에 물린 SIL 실측으로 보정된 값입니다. 견적 숫자의 물리적 근거입니다.",n:["n-fms","n-agent","n-isaac","n-worker"],e:["e-agent-isaac","e-fms-worker"],f:[
 {fd:"엣지 통과·도킹 시간 실측 로그",fp:"DDS 토픽 기록 → 분포 적합(오프라인)",fr:"isaac-sim → agent → 보정분포 테이블"},
 {fd:"보정된 시간 분포 파라미터",fp:"SQL SELECT calibration_params",fr:"postgres → sim-worker (DES 입력)"}]},
{t:"견적 리포트 산출",d:"LLM 모듈이 KPI를 제안서 삽입용 서술로 변환합니다 — 권장 대수, 보장 처리량, 증설 로드맵, 비용. 고객이 받는 최종 산출물입니다.",n:["n-pg","n-be","n-fe"],e:["e-be-pg","e-fe-be"],f:[
 {fd:"KPI 집계 + 구성 비교 결과",fp:"JDBC SELECT run_kpi GROUP BY",fr:"backend ← postgres"},
 {fd:"견적 리포트 (LLM 서술 + P10/P50 차트)",fp:"REST GET /api/reports/{id}",fr:"frontend ← backend"}]}],
inner:[
{t:"주문 발생",d:"수요 프로파일이 가상 주문을 생성합니다(라이브 데모에서는 FE에서 직접 입력). WMS 상태기계가 주문을 생성하고 재고를 확인합니다.",n:["n-fe","n-be"],e:["e-fe-be"],f:[
 {fd:"주문 JSON (화주·품목·수량)",fp:"REST POST /api/orders · DES는 수요 생성기",fr:"frontend → backend"}]},
{t:"운송 오더 발행",d:"BE가 주문을 기록하고 운송 오더 이벤트를 발행합니다. BE와 FMS는 서로를 직접 호출하지 않는 느슨한 결합입니다.",n:["n-be","n-pg","n-emqx"],e:["e-be-pg","e-be-emqx"],f:[
 {fd:"주문·재고·Task 레코드 (run_id 포함)",fp:"JDBC INSERT (트랜잭션)",fr:"backend → postgres"},
 {fd:"TransportOrder 이벤트 (픽업·하역 스테이션)",fp:"MQTT pub biz/order",fr:"backend → emqx"}]},
{t:"할당 · 경로 계획",d:"FMS가 유휴 로봇을 할당하고 시공간 예약 기반으로 충돌 없는 경로를 계산합니다. 이 층의 솔버 선택이 저희 연구 주제입니다.",n:["n-emqx","n-fms"],e:["e-emqx-fms"],f:[
 {fd:"TransportOrder 수신 → 월드모델 반영",fp:"MQTT sub biz/order",fr:"emqx → fms-core"},
 {fd:"할당·경로·예약 (내부 사이클, 결정 로그 기록)",fp:"in-memory (500ms 주기)",fr:"fms-core 내부"}]},
{t:"VDA 5050 오더 전송",d:"국제 표준 메시지로 로봇 agent에 노드/엣지 시퀀스가 전달됩니다. 실제 상용 AMR과 같은 방식입니다.",n:["n-emqx","n-agent","n-fms"],e:["e-emqx-fms","e-emqx-agent"],f:[
 {fd:"Order (노드/엣지 시퀀스, released=base만 승인)",fp:"MQTT uagv/v2/{maker}/{serial}/order",fr:"fms-core → emqx → amr-agent"}]},
{t:"주행 실행",d:"agent가 경로를 추종해 속도 명령을 만들고, Isaac Sim이 물리로 응답합니다. DES에서는 이 구간이 보정된 시간 분포 샘플링으로 대체됩니다.",n:["n-agent","n-isaac","n-worker"],e:["e-agent-isaac"],f:[
 {fd:"cmd_vel (Twist, 20Hz)",fp:"DDS /amr_XX/cmd_vel",fr:"amr-agent → isaac-sim"},
 {fd:"odom·pose·(scan) 피드백 (30Hz)",fp:"DDS /amr_XX/odom · /pose",fr:"isaac-sim → amr-agent"}]},
{t:"상태 보고 · 교통 관리",d:"로봇이 2Hz로 상태를 보고하면 FMS가 지나간 예약을 해제하고 다음 구간을 승인(stitching)합니다. 로봇 간 간섭이 여기서 발생하며, 이것이 견적 숫자를 좌우합니다.",n:["n-agent","n-emqx","n-fms"],e:["e-emqx-agent","e-emqx-fms"],f:[
 {fd:"State (위치·배터리·lastNode·액션 상태, 2Hz)",fp:"MQTT uagv/v2/…/state",fr:"amr-agent → emqx → fms-core"},
 {fd:"base 연장 Order (orderUpdateId 증가)",fp:"MQTT uagv/v2/…/order",fr:"fms-core → amr-agent"}]},
{t:"피킹 · 재고 갱신",d:"스테이션 도킹 후 피킹이 시간 분포로 처리되고 재고가 원자적으로 전이됩니다. 사람 작업자도 처리 용량으로 모델링됩니다.",n:["n-be","n-emqx","n-pg"],e:["e-be-emqx","e-be-pg"],f:[
 {fd:"도킹 완료 액션 → 피킹 완료 이벤트 (분포 지연)",fp:"MQTT fms/event → 가상 피킹 워커",fr:"emqx → backend"},
 {fd:"재고 차감 + Task 상태 전이",fp:"JDBC UPDATE (단일 트랜잭션)",fr:"backend → postgres"}]},
{t:"출고 — 한 주문의 완주",d:"도크 도착으로 주문이 SHIPPED로 종결됩니다. 이 완주가 수천 번 반복 측정된 것이 견적 탭의 그 분포입니다.",n:["n-be","n-fe"],e:["e-fe-be"],f:[
 {fd:"주문 상태 SHIPPED + 로봇 위치 스트림",fp:"WebSocket push (게이트웨이 중계)",fr:"backend → frontend 관제 맵"}]}]};
var cur="quote",idx=0;
function render(){
  var s=flows[cur][idx];
  document.querySelectorAll('[id^="n-"]').forEach(function(el){el.style.opacity=s.n.indexOf(el.id)>=0?"1":"0.22";});
  document.querySelectorAll('[id^="e-"]').forEach(function(el){
    var on=s.e.indexOf(el.id)>=0;
    el.style.opacity=on?"1":"0.15"; el.style.strokeWidth=on?"2.5":"1.5";
    var lbl=document.getElementById("l-"+el.id.slice(2));
    if(lbl){lbl.style.opacity=on?"1":"0.25"; lbl.style.fontWeight=on?"700":"400"; lbl.style.fill=on?"#5f5e5a":"#9a978a";}
  });
  document.getElementById("step-label").textContent=(idx+1)+" / "+flows[cur].length;
  document.getElementById("step-title").textContent=s.t;
  document.getElementById("step-desc").textContent=s.d;
  var fl=document.getElementById("step-flows"); fl.innerHTML="";
  s.f.forEach(function(x){
    var row=document.createElement("div"); row.className="flow";
    var a=document.createElement("span"); a.className="fd"; a.textContent=x.fd;
    var b=document.createElement("span"); b.className="fp"; b.textContent=x.fp;
    var c=document.createElement("span"); c.className="fr"; c.textContent=x.fr;
    row.appendChild(a); row.appendChild(b); row.appendChild(c); fl.appendChild(row);
  });
  document.getElementById("tab-quote").className=cur==="quote"?"active":"";
  document.getElementById("tab-inner").className=cur==="inner"?"active":"";
  document.getElementById("flow-hint").textContent=cur==="quote"?"견적 파이프라인":"시뮬레이션 내부";
}
function next(){idx=Math.min(idx+1,flows[cur].length-1);render();}
function prev(){idx=Math.max(idx-1,0);render();}
document.getElementById("btn-next").onclick=next;
document.getElementById("btn-prev").onclick=prev;
document.getElementById("tab-quote").onclick=function(){cur="quote";idx=0;render();};
document.getElementById("tab-inner").onclick=function(){cur="inner";idx=0;render();};
document.addEventListener("keydown",function(ev){
  if(ev.key==="ArrowRight"){next();}
  else if(ev.key==="ArrowLeft"){prev();}
  else if(ev.key==="1"){cur="quote";idx=0;render();}
  else if(ev.key==="2"){cur="inner";idx=0;render();}
});
render();
</script>
</body>
</html>
